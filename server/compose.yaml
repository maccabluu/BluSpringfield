services:
  springfield-server:
    image: ghcr.io/al1sant0s/springfield:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./static:/app/static

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - springfield-server
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/var/www/media:ro
      - ./static:/var/www/static:ro
      - ./dlc:/var/www/dlc:ro
